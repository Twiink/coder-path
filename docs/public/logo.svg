<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)" opacity="0.1"/>

  <!-- 路径符号 -->
  <path d="M 60 80 Q 80 60, 100 80 T 140 80"
        stroke="url(#grad1)"
        stroke-width="8"
        fill="none"
        stroke-linecap="round"/>

  <path d="M 60 100 Q 80 80, 100 100 T 140 100"
        stroke="url(#grad1)"
        stroke-width="8"
        fill="none"
        stroke-linecap="round"/>

  <path d="M 60 120 Q 80 100, 100 120 T 140 120"
        stroke="url(#grad1)"
        stroke-width="8"
        fill="none"
        stroke-linecap="round"/>

  <!-- 代码符号 -->
  <text x="100" y="155"
        font-family="monospace"
        font-size="24"
        font-weight="bold"
        fill="url(#grad1)"
        text-anchor="middle">
    &lt;/&gt;
  </text>
</svg>
