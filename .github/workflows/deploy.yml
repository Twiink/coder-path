name: Deploy VitePress

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitepress-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VitePress site
        run: npm run docs:build

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add known hosts
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        run: |
          ssh-keyscan -p "${REMOTE_PORT:-22}" -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${REMOTE_PORT:-22}" "$REMOTE_USER@$REMOTE_HOST" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: Deploy to server
        env:
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${REMOTE_PORT:-22} -o StrictHostKeyChecking=no" \
            docs/.vitepress/dist/ \
            "$REMOTE_USER@$REMOTE_HOST:$DEPLOY_PATH/"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
